[package]
name = "tp5"
version = "0.1.0"
edition = "2021"
description = "SIA TP5: autoencoders (basico, denoising, variacional) con backprop propio sobre ndarray"

[lib]
name = "tp5"
path = "src/lib.rs"

[[bin]]
name = "tp5"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ndarray = "0.17"
rand = "0.8"
rand_chacha = "0.3"
