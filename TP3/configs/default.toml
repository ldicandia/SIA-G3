# Exercise 1: fraud TinyModel (knowledge distillation from BigModel).

[features]
# The absolute purchase time identifies *when* a transaction happened, not how
# risky it is: hour-of-day and weekday show no BigModel signal (see
# timestamp_profile.csv) and a raw epoch would not generalize to future data.
drop = ["timestamp"]
# Heavy right tails (skewness > 1) compressed before standardization so a few
# extreme rows do not dominate the single neuron's gradient.
log1p = [
    "amount_usd",
    "days_since_last_purchase",
    "time_since_last_login_s",
]

[split]
# 15% stratified test set, consulted once; 5-fold CV over the remaining 85%.
test_ratio = 0.15
folds = 5
seed = 42
stratification_bins = 10

[search]
learning_rates = [0.001, 0.005, 0.01, 0.05]
max_epochs = 2000
patience = 100
min_delta = 1e-8
initialization_seed = 42
