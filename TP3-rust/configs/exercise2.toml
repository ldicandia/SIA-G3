# Exercise 2: handwritten digits with a multilayer perceptron.
#
# Every candidate is trained on the same stratified 80/20 split of digits.csv.
# The study varies ONE factor at a time around a shared reference model, so
# each axis is a controlled comparison:
#
#   reference     [784,64,32,10], ReLU, Adam lr=0.001, batch 64, Xavier init
#   lr_sgd        learning-rate sweep with plain SGD
#   lr_momentum   learning-rate sweep with SGD + momentum 0.9
#   lr_adam       learning-rate sweep with Adam (reference is lr=0.001)
#   architecture  depth/width with the reference optimizer and learning rate
#   activation    hidden activation (reference is ReLU)
#   batch_size    mini-batch size (reference is 64)
#   initialization He instead of Xavier
#
# The optimizer comparison compares each optimizer at ITS best learning rate
# from its own sweep, so a badly chosen rate does not decide the comparison.

validation_ratio = 0.20
split_seed = 42

[[candidates]]
name = "reference"
axis = "reference"
topology = [784, 64, 32, 10]
hidden_activation = "relu"
optimizer = "adam"
learning_rate = 0.001
batch_size = 64
max_epochs = 40
patience = 5
min_delta = 1e-05
seed = 42

