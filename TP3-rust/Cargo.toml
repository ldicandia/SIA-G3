[package]
name = "tp3-rust"
version = "0.1.0"
edition = "2021"
description = "Educational perceptrons and fraud knowledge-distillation experiments"

[features]
default = []
training-logs = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
plotters = "0.3"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
approx = "0.5"
